<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Price Trends | User Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const labels = {{ labels | tojson }};
const prices = {{ prices | tojson }};

// If only one city exists
if (labels.length === 1) {
    labels.unshift("Other City");
    prices.unshift(prices[0] - 30000);
}
</script>

<style>

body {
    margin:0;
    font-family:"Segoe UI", sans-serif;
    background:linear-gradient(135deg,#f4f6fb,#eef1f7);
}

.container {
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

/* Header */

.header {
    background:linear-gradient(135deg,#6a5cff,#7c6dff);
    color:#fff;
    padding:25px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    margin-bottom:30px;
}

/* Chart Card */

.chart-card {
    background:white;
    border-radius:14px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

canvas {
    max-height:420px;
}

/* Button */

.back-btn {
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    background:linear-gradient(135deg,#6a5cff,#7c6dff);
    color:#fff;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
}

.chart-title {
    font-size:18px;
    font-weight:600;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h2>📊 City-wise Price Analysis</h2>
<p>Average property price comparison across cities</p>
</div>

<div class="chart-card">

<div class="chart-title">
🏙 Average Price per City
</div>

<canvas id="priceChart"></canvas>

</div>

<a href="/user_dashboard" class="back-btn">
⬅ Back to Dashboard
</a>

</div>

<script>

/* Chart Context */

const ctx = document.getElementById('priceChart').getContext('2d');

/* Gradient */

const gradient = ctx.createLinearGradient(0,0,0,400);

gradient.addColorStop(0,'rgba(106,92,255,0.6)');
gradient.addColorStop(1,'rgba(106,92,255,0.05)');

/* Modern Bar Chart */

new Chart(ctx, {

type: "bar",

data: {

labels: labels,

datasets: [{

label: "Average Price (₹)",

data: prices,

backgroundColor: gradient,

borderRadius: 10,

hoverBackgroundColor: "#7c6dff"

}]

},

options: {

responsive: true,

plugins: {

legend: {
labels: {
font: {
size: 14,
weight: "bold"
}
}
},

tooltip: {

backgroundColor: "#111827",

titleColor: "#ffffff",

bodyColor: "#ffffff",

callbacks: {

label: function(ctx) {
return "₹ " + ctx.raw.toLocaleString();
}

}

}

},

scales: {

x: {

grid: {
display: false
}

},

y: {

ticks: {

callback: function(value) {
return "₹ " + value.toLocaleString();
}

},

grid: {
color: "rgba(0,0,0,0.05)"
}

}

}

}

});

</script>

</body>
</html>
